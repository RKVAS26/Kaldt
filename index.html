<<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operasjon Henrik</title>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="app.js"></script>
</head>

<body>

<header>
    <h1>🪖 Operasjon Henrik</h1>
    <p>Hvor skal HV-soldat Henrik tjenestegjøre?</p>
</header>

<div class="container">

    <div class="card intro">
        <h2>Oppdrag</h2>

        <p>
            Plasser Henrik der du tror han skal tjenestegjøre.
        </p>

        <p>
            Alle tips er skjult fram til avsløring.
        </p>
    </div>

    <div class="card controls">

        <input
            id="name"
            type="text"
            placeholder="Ditt navn">

        <button id="guessBtn">
            🪖 Plasser Henrik
        </button>

    </div>

    <div id="map"></div>

    <div class="card">
        <div id="status">
            Klar til innsending.
        </div>
    </div>

    <div class="card admin">

        <h2>⭐ Administrasjon</h2>

        <button id="adminBtn">
            Admin
        </button>

        <button id="answerBtn" style="display:none">
            Sett fasit
        </button>

        <button id="revealBtn" style="display:none">
            Avslør tips
        </button>

        <button id="winnerBtn" style="display:none">
            Beregn vinner
        </button>

        <div id="results"></div>

    </div>

</div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

app.jsscript>

</body>
</html>
